events {
    worker_connections 1024;
}

http {
    upstream backstage {
        server backstage:7007;
    }

    upstream score-api {
        server score-service:8081;
    }

    upstream score-webhooks {
        server score-service:8082;
    }

    upstream plugin-manager {
        server plugin-manager:8083;
    }

    upstream che {
        server che:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # API Gateway root
        location / {
            root /usr/share/nginx/html/api-docs;
            index index.html;
        }

        # Backstage Portal
        location /backstage/ {
            proxy_pass http://backstage/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Score REST API
        location /api/score/ {
            proxy_pass http://score-api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers - for production, replace * with specific domains
            # Example: add_header Access-Control-Allow-Origin "https://app.example.com" always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Score Webhooks
        location /webhooks/score/ {
            proxy_pass http://score-webhooks/webhooks/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Plugin Manager API
        location /api/plugins/ {
            proxy_pass http://plugin-manager/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers - for production, replace * with specific domains
            # Example: add_header Access-Control-Allow-Origin "https://app.example.com" always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Eclipse Che
        location /che/ {
            proxy_pass http://che/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
