# Docker Compose override for development
# This file is automatically merged in when running `docker compose up`
# alongside compose.yaml. To use production settings only, run:
# docker compose -f compose.yaml up

services:
  score-service:
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    volumes:
      # Mount source for hot reload (if using nodemon)
      - ./score-service:/app:ro
      - /app/node_modules

  plugin-manager:
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    volumes:
      # Mount source for hot reload
      - ./plugin-manager:/app:ro
      - /app/node_modules

  gateway:
    volumes:
      # Hot reload nginx config
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
