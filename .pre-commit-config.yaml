# Pre-commit hooks for uFawkes product suite repos
# Install: pre-commit install --hook-type commit-msg
# Run manually: pre-commit run --all-files
#
# All repos pinned to exact SHAs — no unpinned refs.
# Matches the versions used by uFawkesPipe reusable-preflight CI.

repos:
  # ============================================================================
  # General Code Quality
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # ============================================================================
  # Python (Ruff)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # ============================================================================
  # YAML Linting
  # ============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint"]
        types: [yaml]

  # ============================================================================
  # Markdown Linting
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json", "--fix"]
        # release-please's changelog template uses dash bullets and double
        # blank lines, which permanently conflict with MD004/MD012 here.
        # Machine-generated, not hand-authored.
        exclude: ^CHANGELOG\.md$

  # ============================================================================
  # Security Scanning
  # ============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # ============================================================================
  # Conventional Commits
  # ============================================================================
  - repo: local
    hooks:
      - id: commit-msg
        name: Conventional Commit
        entry: scripts/commit-msg.sh
        language: script
        stages: [commit-msg]
