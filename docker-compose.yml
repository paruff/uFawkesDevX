services:
  # Backstage - Developer Portal
  backstage:
    image: backstage/backstage:latest
    container_name: developerd-backstage
    ports:
      - "${BACKSTAGE_PORT:-7007}:7007"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:7007}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-http://localhost:7007}
      - AUTH_PROVIDER=local
    volumes:
      - ./backstage/app-config.yaml:/app/app-config.yaml:ro
      - ./backstage/catalog:/app/catalog:ro
      - backstage-plugins:/app/plugins
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control-plane
    restart: unless-stopped

  # PostgreSQL - Database for Backstage and Score
  postgres:
    image: postgres:15-alpine
    container_name: developerd-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-backstage}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - control-plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backstage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Eclipse Che - Cloud Development Environments
  che:
    image: quay.io/eclipse/che-server:latest
    container_name: developerd-che
    ports:
      - "${CHE_PORT:-8080}:8080"
    environment:
      - CHE_HOST=${CHE_HOST:-localhost}
      - CHE_PORT=${CHE_PORT:-8080}
      - CHE_WORKSPACE_STORAGE=${CHE_WORKSPACE_STORAGE:-/che/workspaces}
      - CHE_AUTH_BASIC_ENABLED=true
      - CHE_MULTIUSER=false
    volumes:
      - che-data:/che/data
      - che-workspaces:/che/workspaces
      # WARNING: Mounting Docker socket provides root-level access to host
      # For production, consider Docker-in-Docker or remove this mount
      # and use Che with Kubernetes instead
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control-plane
    restart: unless-stopped

  # Score Service - Workload Spec Management
  score-service:
    build:
      context: ./score-service
      dockerfile: Dockerfile
    container_name: developerd-score
    ports:
      - "${SCORE_API_PORT:-8081}:8081"
      - "${SCORE_WEBHOOK_PORT:-8082}:8082"
    environment:
      - API_PORT=8081
      - WEBHOOK_PORT=8082
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/score
      - PIPELINE_TRIGGER_ENABLED=${PIPELINE_TRIGGER_ENABLED:-true}
      - AUTH_PROVIDER=local
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - score-specs:/app/specs
      - score-plugins:/app/plugins
      - ./score-service/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control-plane
    restart: unless-stopped

  # API Gateway - Central REST API and Webhook Router
  gateway:
    image: nginx:alpine
    container_name: developerd-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/api-docs:/usr/share/nginx/html/api-docs:ro
    networks:
      - control-plane
    depends_on:
      - backstage
      - score-service
    restart: unless-stopped

  # Plugin Manager - Extension Point Management
  plugin-manager:
    build:
      context: ./plugin-manager
      dockerfile: Dockerfile
    container_name: developerd-plugin-manager
    ports:
      - "${PLUGIN_MANAGER_PORT:-8083}:8083"
    environment:
      - API_PORT=8083
      - PLUGIN_DIR=/plugins
      - REGISTRY_URL=${PLUGIN_REGISTRY_URL:-}
      - AUTH_PROVIDER=local
    volumes:
      - plugin-registry:/plugins
      # WARNING: Mounting Docker socket provides root-level access to host
      # Only needed if plugin manager needs to manage containers
      # For production, use Kubernetes API or remove this mount
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control-plane
    restart: unless-stopped

networks:
  control-plane:
    name: developerd-control-plane
    driver: bridge

volumes:
  postgres-data:
    name: developerd-postgres-data
  backstage-plugins:
    name: developerd-backstage-plugins
  che-data:
    name: developerd-che-data
  che-workspaces:
    name: developerd-che-workspaces
  score-specs:
    name: developerd-score-specs
  score-plugins:
    name: developerd-score-plugins
  plugin-registry:
    name: developerd-plugin-registry
