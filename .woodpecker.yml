# uFawkesDevX self-CI (DX-007)
# Runs on every push and pull request.

when:
  - event: [push, pull_request]

steps:
  - name: lint-yaml
    image: python:3.12-slim
    commands:
      - pip install yamllint --quiet
      - yamllint . || true

  - name: lint-markdown
    image: node:20-alpine
    commands:
      - npm install -g markdownlint-cli --silent
      - markdownlint '**/*.md' --ignore node_modules --ignore templates || true

  - name: contract-tests
    image: python:3.12-slim
    commands:
      - pip install -r requirements-test.txt --quiet
      - pytest tests/unit/ -v --tb=short
