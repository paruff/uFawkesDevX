# .github/ISSUE_TEMPLATE/bug_report.yml
name: 🐛 Bug Report
description: Report a bug in uFawkesDevX (Backstage, Coder, templates)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: e.g., Backstage plugin fails to load
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Backstage
        - Coder
        - Templates
        - Makefile / Scripts
        - Documentation
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: uFawkesDevX Version / Tag
      placeholder: v1.5.0-beta.1

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      render: shell
