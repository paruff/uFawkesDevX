name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Stage 0: Pre-flight ──────────────────────────────────────────────────
  preflight:
    name: Pre-flight
    uses: paruff/ufawkespipe/.github/workflows/reusable-preflight.yml@main # main branch
    with:
      # CI's hook stages run in the suite's CI image (ci-pipeline spec R4).
      # Built on fawkes-core 2.2.0 (uFawkesPipe@6905653), matching fawkes-space 2.2.0.
      ci-image: ghcr.io/paruff/ufawkes-ci@sha256:575c812d55ca8f9c4faa5afb77dbb721969f8e866448fe7641e835be79057ee0
      pr-size-limit: 0
      skip-hooks: terraform_fmt,terraform_validate,terraform_tflint,terraform_docs

  # ─── Stage 1: Static Analysis (Lint) ────────────────────────────────────
  lint:
    name: Static Analysis
    needs: [preflight]
    uses: paruff/ufawkespipe/.github/workflows/reusable-lint.yml@main # main branch

  # ─── Stage 2: Security Scanning ─────────────────────────────────────────
  security:
    name: Security Scanning
    needs: [lint]
    uses: paruff/ufawkespipe/.github/workflows/reusable-security-scanning.yml@6dc21095aa8435b09e0503b3aa423ae501b91088 # main, Trivy 0.76.2 install
    with:
      scan-type: all
      severity-threshold: HIGH
      fail-on-critical: true
      ignore-unfixed: false
      upload-sarif: true

  # The reusable scan above writes SARIF only, so a failure names no package or CVE in
  # its log (#102). This prints the same findings as a table. Informational (exit-code 0):
  # the gate stays with `security`. Drop once uFawkesPipe prints a table itself.
  security-findings:
    name: Security Findings (table)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0"

  # ─── Stage 2b: Dependency Review────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    needs: [lint]
    uses: paruff/ufawkespipe/.github/workflows/reusable-dependency-review.yml@main # main branch
    with:
      fail-on-severity: high
      comment-summary-in-pr: "true"

  # ─── Stage 3: Build & Validate ─────────────────────────────────────────
  build:
    name: Build & Validate
    needs: [security, dependency-review]
    uses: paruff/ufawkespipe/.github/workflows/reusable-build.yml@main # main branch
    with:
      fail-on-latest: false
      enable-coverage-gate: false

  # ─── Stage 4: Tests ────────────────────────────────────────────────────
  tests:
    name: Tests
    needs: [build]
    uses: paruff/ufawkespipe/.github/workflows/reusable-tests.yml@main # main branch
    with:
      test-tiers: "unit"
      python-version: "3.11"

  # ─── Gate: Pipeline Complete ────────────────────────────────────────────
  pipeline-complete:
    name: Pipeline Complete
    needs: [preflight, lint, security, dependency-review, build, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: DORA job start
        run: |
          echo "job-start:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sha:${{ github.sha }}"
          echo "workflow:${{ github.workflow }}"
          echo "job:${{ github.job }}"

      - name: Check results
        run: |
          echo "=== Pipeline Results ==="
          echo "Preflight:          ${{ needs.preflight.result }}"
          echo "Static Analysis:    ${{ needs.lint.result }}"
          echo "Security Scanning:  ${{ needs.security.result }}"
          echo "Dependency Review:  ${{ needs.dependency-review.result }}"
          echo "Build & Validate:   ${{ needs.build.result }}"
          echo "Tests:              ${{ needs.tests.result }}"

          if [ "${{ needs.preflight.result }}" == "failure" ] || \
             [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ] || \
             [ "${{ needs.dependency-review.result }}" == "failure" ] || \
             [ "${{ needs.build.result }}" == "failure" ] || \
             [ "${{ needs.tests.result }}" == "failure" ]; then
            echo ""
            echo "❌ Pipeline FAILED"
            exit 1
          fi

          echo ""
          echo "✅ Pipeline PASSED"

      - name: DORA pipeline finish
        if: always()
        run: |
          echo "pipeline-finish:$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "pipeline-result:${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}"
