name: Main CI Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  ci-guard:
    name: CI Guard
    uses: paruff/ufawkespipe/.github/workflows/reusable-main-ci-guard.yml@v1.2.0
    with:
      workflow-id: ci.yml
      workflow-name: "CI"
