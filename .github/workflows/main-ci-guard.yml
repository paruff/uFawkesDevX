name: Main CI Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  ci-guard:
    name: CI Guard
    uses: paruff/ufawkespipe/.github/workflows/reusable-main-ci-guard.yml@41f3e92d6fb63b3779595bed3e44333c67d37028 # v1.15.0-beta.1
    with:
      workflow-id: ci.yml
      workflow-name: "CI"
