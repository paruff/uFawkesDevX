name: Main CI Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  ci-guard:
    name: CI Guard
    uses: paruff/ufawkespipe/.github/workflows/reusable-main-ci-guard.yml@7e1d40f40d4b75580a9aab4273465b8883c9f201 # v1.2.1
    with:
      workflow-id: ci.yml
      workflow-name: "CI"
