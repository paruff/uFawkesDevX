app:
  title: Developer Control Plane
  baseUrl: ${APP_BASE_URL}

organization:
  name: Internal Developer Platform

backend:
  baseUrl: ${BACKEND_BASE_URL}
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", "http:", "https:"]
  cors:
    origin: ${APP_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # SQLite, one file per plugin on the backstage-data volume (#57). Single
  # instance only; back up by copying the volume.
  database:
    client: better-sqlite3
    connection:
      directory: /data

# Local authentication configuration
auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

integrations:
  # Integration with Score service
  score:
    host: http://score-service:8081

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
  locations:
    # Local catalog entities
    - type: file
      target: /app/catalog/all.yaml
      rules:
        - allow:
            [Component, System, API, Resource, Location, Template, User, Group]
    # Score workload templates
    - type: file
      target: /app/catalog/templates/score-workload.yaml
      rules:
        - allow: [Template]

# Plugin extension points
plugins:
  # Score integration plugin
  score:
    enabled: true
    apiEndpoint: http://score-service:8081
    webhookEndpoint: http://score-service:8082
  # Custom plugin loader
  custom:
    pluginDir: /app/plugins
    autoload: true

# Proxy configuration for external services
proxy:
  "/score-api":
    target: "http://score-service:8081"
    changeOrigin: true
    pathRewrite:
      "^/score-api": "/"
  "/plugin-manager":
    target: "http://plugin-manager:8083"
    changeOrigin: true
    pathRewrite:
      "^/plugin-manager": "/"

# Kubernetes promotion path configuration
kubernetes:
  # These settings support promotion to K8s
  serviceLocatorMethod:
    type: "multiTenant"
  clusterLocatorMethods:
    - type: "config"
      clusters: []

# Scaffolder templates for workload deployment
scaffolder:
  defaultAuthor:
    name: Developer Control Plane
    email: platform@example.com
