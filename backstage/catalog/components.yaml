apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: score-service
  title: Score Workload Service
  description: Manages Score workload specifications, validation, and pipeline triggers
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: developer-control-plane
  providesApis:
    - score-api
    - score-webhooks

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: plugin-manager
  title: Plugin Manager
  description: Manages platform extensions and plugins
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: developer-control-plane
  providesApis:
    - plugin-api

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: score-api
  title: Score REST API
  description: REST API for Score workload management
spec:
  type: openapi
  lifecycle: production
  owner: platform-team
  system: developer-control-plane
  definition: |
    openapi: 3.0.0
    info:
      title: Score API
      version: 1.0.0

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: score-webhooks
  title: Score Webhooks
  description: Webhook endpoints for Score events
spec:
  type: webhook
  lifecycle: production
  owner: platform-team
  system: developer-control-plane

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: plugin-api
  title: Plugin Manager API
  description: API for managing platform plugins and extensions
spec:
  type: openapi
  lifecycle: production
  owner: platform-team
  system: developer-control-plane
